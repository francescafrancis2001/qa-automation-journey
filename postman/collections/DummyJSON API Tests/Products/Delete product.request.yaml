$kind: http-request
url: "{{baseUrl}}/products/1"
method: DELETE
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 200\", () => {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Content-Type is JSON\", () => {\r

      \    pm.expect(pm.response.headers.get(\"Content-Type\")).to.include(\"application/json\");\r

      });\r

      \r

      // Your task: look at the response body, find the field that says the product\r

      // was deleted, and add a pm.test that checks it."
    language: text/javascript
order: 6000
