$kind: http-request
url: "{{baseUrl}}/products/search?q={{term}}"
method: GET
queryParams:
  q: "{{term}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 200\", () => {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      const result = pm.response.json();\r

      \r

      pm.test(\"products is an array and total is above 0\", () => {\r

      \    pm.expect(result.products).to.be.an(\"array\");\r

      \    pm.expect(result.total).to.be.above(0);\r

      });"
    language: text/javascript
order: 3000
