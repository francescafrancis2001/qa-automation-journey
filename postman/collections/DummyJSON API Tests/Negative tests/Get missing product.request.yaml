$kind: http-request
url: "{{baseUrl}}/products/99999"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 404 Not Found\", () => {\r

      \    pm.response.to.have.status(404);\r

      });\r

      \r

      pm.test(\"Error message mentions the missing id\", () => {\r

      \    pm.expect(pm.response.json().message).to.include(\"99999\");\r

      });"
    language: text/javascript
order: 3000
