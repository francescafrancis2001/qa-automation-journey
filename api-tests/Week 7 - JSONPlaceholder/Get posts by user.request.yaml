$kind: http-request
url: "{{baseUrl}}/posts?userId=1"
method: GET
queryParams:
  userId: "1"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", () => {
          pm.response.to.have.status(200);
      });

      pm.test("All posts belong to user 1", () => {
          const json = pm.response.json();
          pm.expect(json).to.have.lengthOf(10);
          json.forEach(post => {
              pm.expect(post.userId).to.eql(1);
          });
      });
    language: text/javascript
order: 7000
