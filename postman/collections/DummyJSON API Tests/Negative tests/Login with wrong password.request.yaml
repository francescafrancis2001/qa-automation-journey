$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
body:
  type: json
  content: "{\r

    \  \"username\": \"{{username}}\",\r

    \  \"password\": \"wrong-password\"\r

    }"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 400 Bad Request\", () => {\r

      \    pm.response.to.have.status(400);\r

      });\r

      \r

      pm.test(\"Response has an error message\", () => {\r

      \    pm.expect(pm.response.json().message).to.be.a(\"string\");\r

      });"
    language: text/javascript
order: 2000
